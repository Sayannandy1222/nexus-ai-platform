global:
  resolve_timeout: 5m

route:
  receiver: nexus-default
  group_by:
    - alertname
    - service
    - severity

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: nexus-critical

    - matchers:
        - severity="warning"
      receiver: nexus-warning

receivers:
  - name: nexus-default

  - name: nexus-critical

  - name: nexus-warning
