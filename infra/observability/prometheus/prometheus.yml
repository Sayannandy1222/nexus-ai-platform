global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/nexus-alerts.yml

scrape_configs:
  - job_name: "nexus-api-1"
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - nexus-api-1:8000

  - job_name: "nexus-api-2"
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - nexus-api-2:8000

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

  - job_name: "alertmanager"
    static_configs:
      - targets:
          - alertmanager:9093