[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai-platform"
version = "0.1.0"
description = "Production-grade AI context, RAG, Redis/Valkey observability, and LLMOps platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Sayan Nandy" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "redis>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "structlog>=25.1,<26.0",
    "prometheus-client>=0.21,<1.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1.0",
    "pypdf>=5.0,<7.0",
    "numpy>=2.0,<3.0",
    "tenacity>=9.0,<10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["nexus"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
