services:

  # ============================================================
  # NEXUS API INSTANCE 1
  # ============================================================
  nexus-api-1:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexus-api-1

    restart: unless-stopped

    environment:
      NEXUS_API_KEY: ${NEXUS_API_KEY}

      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # IMPORTANT:
      # Inside Docker, Valkey is reached through its service name.
      REDIS_URL: redis://valkey:6379/0

      # If your application uses this variable instead,
      # keep it available as well.
      VALKEY_URL: redis://valkey:6379/0

    depends_on:
      valkey:
        condition: service_healthy

    networks:
      - nexus

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # NEXUS API INSTANCE 2
  # ============================================================
  nexus-api-2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexus-api-2

    restart: unless-stopped

    environment:
      NEXUS_API_KEY: ${NEXUS_API_KEY}

      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # IMPORTANT:
      # Inside Docker, Valkey is reached through its service name.
      REDIS_URL: redis://valkey:6379/0
      VALKEY_URL: redis://valkey:6379/0

    depends_on:
      valkey:
        condition: service_healthy

    networks:
      - nexus

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # VALKEY
  # ============================================================
  valkey:
    image: valkey/valkey:8.1-alpine

    container_name: nexus-valkey

    restart: unless-stopped

    command:
      - valkey-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    networks:
      - nexus

    volumes:
      - valkey-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "valkey-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ============================================================
  # NGINX API GATEWAY
  # ============================================================
  nginx:
    image: nginx:1.27-alpine

    container_name: nexus-nginx

    restart: unless-stopped

    depends_on:
      nexus-api-1:
        condition: service_healthy
      nexus-api-2:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - nexus

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro


  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: nexus-prometheus

    restart: unless-stopped

    depends_on:
      nexus-api-1:
        condition: service_healthy
      nexus-api-2:
        condition: service_healthy

    ports:
      - "9090:9090"

    networks:
      - nexus

    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus


  # ============================================================
  # ALERTMANAGER
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.28.1

    container_name: nexus-alertmanager

    restart: unless-stopped

    ports:
      - "9093:9093"

    networks:
      - nexus

    volumes:
      - alertmanager-data:/alertmanager


  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana:12.1.1

    container_name: nexus-grafana

    restart: unless-stopped

    depends_on:
      prometheus:
        condition: service_started

    ports:
      - "3000:3000"

    networks:
      - nexus

    volumes:
      - grafana-data:/var/lib/grafana


# ==============================================================
# NETWORK
# ==============================================================
networks:
  nexus:
    name: nexus-ai-platform_nexus
    driver: bridge


# ==============================================================
# VOLUMES
# ==============================================================
volumes:

  valkey-data:
    name: nexus-ai-platform_valkey-data

  prometheus-data:
    name: nexus-ai-platform_prometheus-data

  alertmanager-data:
    name: nexus-ai-platform_alertmanager-data

  grafana-data:
    name: nexus-ai-platform_grafana-data