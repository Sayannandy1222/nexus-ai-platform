services:
  nexus-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://valkey:6379/0
      NEXUS_ENV: development
    depends_on:
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - nexus-network

  nexus-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://valkey:6379/0
      NEXUS_ENV: development
    depends_on:
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - nexus-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexus-api-1:
        condition: service_started
      nexus-api-2:
        condition: service_started
    networks:
      - nexus-network

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: nexus-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - yes
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - nexus-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - nexus-network

volumes:
  nexus-valkey-data:

networks:
  nexus-network:
    driver: bridge