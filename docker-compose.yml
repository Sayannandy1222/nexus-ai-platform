services:
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: nexus-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - yes
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - nexus-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  nexus-valkey-data:
